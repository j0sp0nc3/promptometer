[project]
name = "promptquill-core"
version = "1.0.0"
description = "Zero-dependency prompt evaluation engine — scores, anti-patterns, adversarial tests, rewrites."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "j0sp0nc3" }]
keywords = [
    "prompt",
    "llm",
    "evaluation",
    "scoring",
    "prompt-engineering",
    "promptquill",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/j0sp0nc3/promptquill"
Repository = "https://github.com/j0sp0nc3/promptquill"
Issues = "https://github.com/j0sp0nc3/promptquill/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["promptquill_core"]
